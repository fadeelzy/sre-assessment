image:
  repository: otel/opentelemetry-collector-contrib

mode: daemonset

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    hostmetrics:
      collection_interval: 30s
      scrapers:
        paging:
        cpu:
        disk:
        filesystem:
        load:
        memory:
        network:
        processes:

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 15
    batch:
      timeout: 10s
    resource:
      attributes:
        - key: service.name
          value: "otel-agent"
          action: insert
    k8sattributes:
      auth_type: "serviceAccount"
      passthrough: false
      extract:
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.pod.start_time

  exporters:
    otlp:
      endpoint: "otel-gateway-opentelemetry-collector.observability.svc.cluster.local:4317"
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch, resource, k8sattributes]
        exporters: [otlp]
      metrics:
        receivers: [otlp, hostmetrics]
        processors: [memory_limiter, batch, resource, k8sattributes]
        exporters: [otlp]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch, resource, k8sattributes]
        exporters: [otlp]